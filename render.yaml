services:
  - type: web
    name: lifemanager
    env: python
    buildCommand: cd frontend && npm install && npm run build && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    staticPublishPath: frontend/dist
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.11.0

# ساختِ خودکارِ اپ همراه اندروید (companion.apk)
#
# چرا CI؟ مالک برنامه‌نویس نیست و نباید Android Studio نصب کند؛ محیط توسعهٔ
# ابری هم به SDK اندروید دسترسی ندارد. این workflow روی سرورهای GitHub (که
# SDK دارند) APK را می‌سازد و دو جا می‌گذاردش:
#   ۱) داخل خود ریپو (mobile/companion-android/release/companion.apk) — که
#      بک‌اند آن را در /companion.apk سرو می‌کند؛ یعنی مالک فقط
#      «آدرس-سایت/companion.apk» را روی گوشی باز می‌کند و نصب می‌زند.
#   ۲) یک GitHub Release به نام companion-apk (نسخهٔ پشتیبان).
#
# حلقه نمی‌سازد: کامیتِ خودِ CI فقط پوشهٔ release را عوض می‌کند که از trigger
# مستثناست + گارد actor.
name: Build companion APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/companion-android/**"
      - "!mobile/companion-android/release/**"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: gradle assembleDebug -p mobile/companion-android --no-daemon

      - name: Commit the APK back so the app serves it at /companion.apk
        run: |
          mkdir -p mobile/companion-android/release
          cp mobile/companion-android/app/build/outputs/apk/debug/app-debug.apk \
             mobile/companion-android/release/companion.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add -f mobile/companion-android/release/companion.apk
          git diff --cached --quiet || git commit -m "ci(mobile): companion.apk — نسخهٔ تازهٔ اپ همراه"
          git push

      - name: Refresh the companion-apk release (backup download source)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete companion-apk -y || true
          gh release create companion-apk \
            mobile/companion-android/release/companion.apk \
            --title "اپ همراه اندروید (آخرین نسخه)" \
            --notes "دانلود companion.apk روی گوشی اندرویدی و نصب. راهنما: mobile/companion-android/README.md"
